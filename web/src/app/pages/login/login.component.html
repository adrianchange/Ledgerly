<div class="auth-shell">
  <form class="card" [formGroup]="form" (ngSubmit)="submit()">
    <p class="eyebrow">Ledgerly</p>
    <h1>{{ mode === 'login' ? 'Entrar' : 'Crear cuenta' }}</h1>
    <p class="muted">Gastos por web y por Telegram · FastAPI + Angular</p>

    <label>
      Email
      <input type="email" formControlName="email" autocomplete="email" />
    </label>
    <label>
      Password
      <input type="password" formControlName="password" autocomplete="current-password" />
    </label>

    <p class="error" *ngIf="error">{{ error }}</p>

    <button type="submit" [disabled]="loading">
      {{ loading ? '...' : mode === 'login' ? 'Entrar' : 'Registrarme' }}
    </button>

    <button type="button" class="linkish" (click)="toggle()">
      {{ mode === 'login' ? '¿Nuevo? Crear cuenta' : '¿Ya tienes cuenta? Entrar' }}
    </button>
  </form>
</div>
