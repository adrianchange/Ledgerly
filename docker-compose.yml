services:
  api:
    build: ./api
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: compose-dev-secret
      DATABASE_URL: sqlite:///./ledgerly.db
      BOT_API_TOKEN: dev-bot-token-change-me
      CORS_ORIGINS: http://localhost:4200,http://127.0.0.1:4200
    volumes:
      - ./api:/app
